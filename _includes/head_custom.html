<!-- Favicon: uses page.favicon frontmatter, defaults to 👨‍💻 -->
{% assign icon = page.favicon | default: "👨‍💻" %}
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>{{ icon }}</text></svg>">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0366d6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<!-- Open Graph meta tags -->
<meta property="og:title" content="{{ page.title | default: site.title }}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:image" content="{{ site.url }}/profile.jpg">
<meta property="og:url" content="{{ site.url }}{{ page.url }}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ site.title }}">

<!-- Twitter Card meta tags -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ page.title | default: site.title }}">
<meta name="twitter:description" content="{{ page.description | default: site.description }}">
<meta name="twitter:image" content="{{ site.url }}/profile.jpg">

<!-- Preload critical assets -->
<link rel="preload" href="profile.jpg" as="image" fetchpriority="high">

<!-- Shared styles -->
<style>
  /* Card component */
  .card {
    background-color: #2a2a2a;
    border-left: 3px solid #5a5af0;
    border-radius: 4px;
    margin-bottom: 20px;
    padding: 15px 20px;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
    transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
  }

  .card:hover {
    transform: translateY(-3px);
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
  }

  .card-title {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 8px;
  }

  .card-title a {
    color: #e6e6e6;
    text-decoration: none;
    transition: color 0.2s ease;
  }

  .card-title a:hover {
    color: #5a5af0;
    text-decoration: none;
  }

  .card-description {
    color: #a3a3a3;
    font-size: 14px;
    margin: 0;
  }

  .card-subtitle {
    color: #8a8a8a;
    font-size: 13px;
    font-style: italic;
    margin: 8px 0 0 0;
  }

  /* Quote card variant */
  .card--quote .card-text {
    margin: 0;
    font-style: italic;
    color: #e6e6e6;
    white-space: pre-line;
  }

  .card--quote .card-author {
    display: block;
    text-align: right;
    font-style: italic;
    font-size: 0.9em;
    margin-top: 12px;
    color: #a3a3a3;
    padding-top: 8px;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
  }

  /* Content links */
  .content-link a {
    color: #5a5af0;
    text-decoration: none;
    transition: color 0.2s ease;
    border-bottom: 1px dotted #5a5af0;
    padding-bottom: 1px;
  }

  .content-link a:hover {
    color: #7f7ff5;
    border-bottom: 1px solid #7f7ff5;
  }

  /* Links list */
  .links-list {
    list-style-type: none;
    padding-left: 0;
  }

  .link-item {
    margin-bottom: 12px;
    position: relative;
    padding-left: 24px;
    list-style-type: none;
  }

  .link-item:before {
    content: "";
    position: absolute;
    left: 0;
    top: 10px;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background-color: #5a5af0;
  }

  .link-item a {
    color: #5a5af0;
    text-decoration: none;
    transition: color 0.2s ease;
    border-bottom: 1px dotted #5a5af0;
    padding-bottom: 1px;
  }

  .link-item a:hover {
    color: #7f7ff5;
    border-bottom: 1px solid #7f7ff5;
  }

  /* Section titles */
  .section-title {
    margin-top: 30px;
    margin-bottom: 20px;
    font-size: 22px;
    color: #e6e6e6;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    padding-bottom: 8px;
  }

  /* Content container */
  .content-container {
    margin: 0 auto;
    max-width: 800px;
  }

  /* Mobile responsiveness */
  @media (max-width: 600px) {
    body {
      padding: 10px;
    }
    .main-content {
      padding: 1.2rem;
    }
  }
</style>

{% if jekyll.environment == "production" %}
  {% include analytics.html %}
{% endif %}
